name: Build iOS app - EXTERNAL GH777

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm Xcode 27 and iOS 27 SDK
        run: |
          xcodebuild -version
          xcodebuild -version | grep -q '^Xcode 27'
          xcodebuild -showsdks | grep -q 'iOS 27'

      - name: Verify Cloudflare R2 feed client
        run: |
          set -euo pipefail
          test -s ThreeOneOSFive/helpers/PatchProjectStore.swift
          grep -q 'gh777-patch-feed.marcelamartinszx12.workers.dev' ThreeOneOSFive/helpers/PatchProjectStore.swift
          grep -q 'patches.feed' ThreeOneOSFive/helpers/PatchProjectStore.swift
          grep -q 'httpMethod = "GET"' ThreeOneOSFive/helpers/PatchProjectStore.swift
          grep -q 'name: "input"' ThreeOneOSFive/helpers/PatchProjectStore.swift
          if grep -Eq 'PATCH_SYNC_TOKEN|PatchSyncToken' ThreeOneOSFive/helpers/PatchProjectStore.swift ThreeOneOSFive/Info.plist; then
            echo '::error::O cliente R2 não deve embutir tokens de sincronização.'
            exit 1
          fi
          wc -l -c ThreeOneOSFive/helpers/PatchProjectStore.swift

      - name: Build unsigned Release app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target worse_query \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$RUNNER_TEMP/DerivedData/Build/Products" \
            OBJROOT="$RUNNER_TEMP/DerivedData/Build/Intermediates.noindex" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package app artifact
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/worse_query.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/EXTERNAL-GH777.ipa" Payload)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: external-gh777-ios-ipa
          path: |
            ${{ runner.temp }}/EXTERNAL-GH777.ipa
          if-no-files-found: error
          retention-days: 14
